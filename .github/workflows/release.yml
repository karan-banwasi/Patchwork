name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.1.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          
      - name: Check Formatting (gofmt)
        if: matrix.os == 'ubuntu-latest'
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files require gofmt -s -w:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Verify no stdout/stderr leaks in internal/
        if: matrix.os == 'ubuntu-latest'
        run: |
          LEAKS=$(grep -rnE 'fmt\.Print|os\.Stdout|os\.Stderr' internal/ | grep -v '_test\.go:' || true)
          if [ -n "$LEAKS" ]; then
            echo "Found direct stdout/stderr references in internal/:"
            echo "$LEAKS"
            exit 1
          fi
          
      - name: Run go vet
        run: go vet ./...
        
      - name: Run go test
        run: go test -v ./...

      - name: Run govulncheck
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release:
    needs: test
    if: (github.event_name == 'workflow_dispatch') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      WINGET_PUBLISH: ${{ vars.WINGET_PUBLISH || vars.WINGET_ENABLED || vars.ENABLE_WINGET_PUBLISH }}
      BUMP_TYPE: ${{ github.event.inputs.bump || 'patch' }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.1.0
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Build and Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Ensure all remote tags are fetched
          git fetch --tags --force

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NEW_TAG="${GITHUB_REF#refs/tags/}"
            NEW_VERSION="${NEW_TAG#v}"
          else
            # Get the latest tag safely without failing under set -e
            LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v0.0.0"
            fi
            
            # Parse version components
            VERSION=${LATEST_TAG#v}
            IFS='.' read -ra PARTS <<< "$VERSION"
            MAJOR="${PARTS[0]:-0}"
            MINOR="${PARTS[1]:-0}"
            PATCH="${PARTS[2]:-0}"
            
            case "$BUMP_TYPE" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              *)
                PATCH=$((PATCH + 1))
                ;;
            esac

            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            NEW_TAG="v$NEW_VERSION"
          fi
          
          echo "Release tag: $NEW_TAG"
          
          # Generate Windows resource (.syso) files stamped with the exact release version
          go run github.com/tc-hib/go-winres@v0.3.3 make --arch amd64,arm64,386 --product-version "$NEW_VERSION" --file-version "$NEW_VERSION"
          
          # Cross-compile for Windows natively (amd64 and arm64) from Ubuntu
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X github.com/karan-banwasi/patchwork/cmd.version=$NEW_TAG" -o pw.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags "-s -w -X github.com/karan-banwasi/patchwork/cmd.version=$NEW_TAG" -o pw-arm64.exe .

          # Cross-compile for macOS (Darwin arm64 and amd64) and Linux (amd64 and arm64)
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X github.com/karan-banwasi/patchwork/cmd.version=$NEW_TAG" -o pw-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X github.com/karan-banwasi/patchwork/cmd.version=$NEW_TAG" -o pw-darwin-amd64 .
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X github.com/karan-banwasi/patchwork/cmd.version=$NEW_TAG" -o pw-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X github.com/karan-banwasi/patchwork/cmd.version=$NEW_TAG" -o pw-linux-arm64 .
          
          # Compute SHA256 hashes and generate Winget manifest files for the release
          SHA_X64=$(sha256sum pw.exe | awk '{print toupper($1)}')
          SHA_ARM64=$(sha256sum pw-arm64.exe | awk '{print toupper($1)}')
          
          sed -e "s/PackageVersion: .*/PackageVersion: $NEW_VERSION/" \
              winget/KaranBanwasi.Patchwork.yaml > KaranBanwasi.Patchwork.yaml
          sed -e "s/PackageVersion: .*/PackageVersion: $NEW_VERSION/" \
              -e "s|releases/tag/v.*|releases/tag/$NEW_TAG|" \
              winget/KaranBanwasi.Patchwork.locale.en-US.yaml > KaranBanwasi.Patchwork.locale.en-US.yaml
          {
            echo "# yaml-language-server: \$schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json"
            echo ""
            echo "PackageIdentifier: KaranBanwasi.Patchwork"
            echo "PackageVersion: $NEW_VERSION"
            echo "InstallerType: portable"
            echo "Commands:"
            echo "  - pw"
            echo "Installers:"
            echo "  - Architecture: x64"
            echo "    InstallerUrl: https://github.com/$GH_REPO/releases/download/$NEW_TAG/pw.exe"
            echo "    InstallerSha256: $SHA_X64"
            echo "  - Architecture: arm64"
            echo "    InstallerUrl: https://github.com/$GH_REPO/releases/download/$NEW_TAG/pw-arm64.exe"
            echo "    InstallerSha256: $SHA_ARM64"
            echo "ManifestType: installer"
            echo "ManifestVersion: 1.6.0"
          } > KaranBanwasi.Patchwork.installer.yaml
          
          # Create a GitHub Release with the compiled binaries and Winget manifests attached
          gh release create "$NEW_TAG" \
            pw.exe pw-arm64.exe \
            pw-darwin-arm64 pw-darwin-amd64 \
            pw-linux-amd64 pw-linux-arm64 \
            KaranBanwasi.Patchwork.yaml \
            KaranBanwasi.Patchwork.locale.en-US.yaml \
            KaranBanwasi.Patchwork.installer.yaml \
            --title "Release $NEW_TAG" --generate-notes

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.2.0
        with:
          subject-path: |
            pw.exe
            pw-arm64.exe
            pw-darwin-arm64
            pw-darwin-amd64
            pw-linux-amd64
            pw-linux-arm64

      - name: Publish to winget-pkgs
        if: env.WINGET_TOKEN != '' && (vars.WINGET_PUBLISH == 'true' || vars.WINGET_ENABLED == 'true' || vars.ENABLE_WINGET_PUBLISH == 'true' || env.WINGET_PUBLISH == 'true')
        continue-on-error: true
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          NEW_VERSION=${LATEST_TAG#v}
          PKG_ID="KaranBanwasi.Patchwork"
          
          GH_USER=$(gh api user --jq .login)
          git config --global user.name "$GH_USER"
          git config --global user.email "$GH_USER@users.noreply.github.com"
          
          # Ensure fork exists
          gh repo fork microsoft/winget-pkgs --clone=false || true
          
          mkdir -p /tmp/winget-pkgs
          cd /tmp/winget-pkgs
          
          git clone --filter=blob:none --no-checkout --depth 1 "https://x-access-token:${WINGET_TOKEN}@github.com/${GH_USER}/winget-pkgs.git" .
          git remote add upstream "https://github.com/microsoft/winget-pkgs.git"
          git fetch upstream master --depth 1
          
          git sparse-checkout init --cone
          git sparse-checkout set "manifests/k/KaranBanwasi/Patchwork"
          git checkout -B "patchwork-${NEW_VERSION}" FETCH_HEAD
          
          if [ ! -d "manifests/k/KaranBanwasi/Patchwork" ]; then
            echo "Initial package PR has not been merged into microsoft/winget-pkgs yet. Skipping automated version bump PR."
            exit 0
          fi
          
          DEST_DIR="manifests/k/KaranBanwasi/Patchwork/${NEW_VERSION}"
          mkdir -p "$DEST_DIR"
          cp "$GITHUB_WORKSPACE/KaranBanwasi.Patchwork.yaml" "$DEST_DIR/"
          cp "$GITHUB_WORKSPACE/KaranBanwasi.Patchwork.locale.en-US.yaml" "$DEST_DIR/"
          cp "$GITHUB_WORKSPACE/KaranBanwasi.Patchwork.installer.yaml" "$DEST_DIR/"
          
          git add "$DEST_DIR"
          git commit -m "New version: ${PKG_ID} version ${NEW_VERSION}"
          git push -u origin "patchwork-${NEW_VERSION}" --force
          
          gh pr create \
            --repo microsoft/winget-pkgs \
            --head "${GH_USER}:patchwork-${NEW_VERSION}" \
            --base master \
            --title "New version: ${PKG_ID} version ${NEW_VERSION}" \
            --body "Automated release PR for ${PKG_ID} version ${NEW_VERSION}."
