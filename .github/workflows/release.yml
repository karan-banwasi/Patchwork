name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          
      - name: Run go vet
        run: go vet ./...
        
      - name: Run go test
        run: go test ./...

  release:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build and Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Ensure all remote tags are fetched
          git fetch --tags --force
          
          # Get the latest tag safely without failing under set -e
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          
          # Parse and increment the patch version
          VERSION=${LATEST_TAG#v}
          IFS='.' read -ra PARTS <<< "$VERSION"
          MAJOR="${PARTS[0]:-0}"
          MINOR="${PARTS[1]:-0}"
          PATCH="${PARTS[2]:-0}"
          
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          NEW_TAG="v$NEW_VERSION"
          
          echo "Previous tag: $LATEST_TAG"
          echo "New tag: $NEW_TAG"
          
          # Regenerate Windows resource (.syso) files stamped with the exact release version
          go run github.com/tc-hib/go-winres make --arch amd64,arm64,386 --product-version "$NEW_VERSION" --file-version "$NEW_VERSION"
          
          # Cross-compile for Windows natively (amd64 and arm64) from Ubuntu
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X github.com/karan-banwasi/patchwork/cmd.version=$NEW_TAG" -o pw.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags "-s -w -X github.com/karan-banwasi/patchwork/cmd.version=$NEW_TAG" -o pw-arm64.exe .
          
          # Compute SHA256 hashes and generate Winget manifest files for the release
          SHA_X64=$(sha256sum pw.exe | awk '{print toupper($1)}')
          SHA_ARM64=$(sha256sum pw-arm64.exe | awk '{print toupper($1)}')
          
          sed -e "s/PackageVersion: .*/PackageVersion: $NEW_VERSION/" \
              winget/KaranBanwasi.Patchwork.yaml > KaranBanwasi.Patchwork.yaml
          sed -e "s/PackageVersion: .*/PackageVersion: $NEW_VERSION/" \
              -e "s|releases/tag/v.*|releases/tag/$NEW_TAG|" \
              winget/KaranBanwasi.Patchwork.locale.en-US.yaml > KaranBanwasi.Patchwork.locale.en-US.yaml
          {
            echo "# yaml-language-server: \$schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json"
            echo ""
            echo "PackageIdentifier: KaranBanwasi.Patchwork"
            echo "PackageVersion: $NEW_VERSION"
            echo "InstallerType: portable"
            echo "Commands:"
            echo "  - pw"
            echo "Installers:"
            echo "  - Architecture: x64"
            echo "    InstallerUrl: https://github.com/$GH_REPO/releases/download/$NEW_TAG/pw.exe"
            echo "    InstallerSha256: $SHA_X64"
            echo "  - Architecture: arm64"
            echo "    InstallerUrl: https://github.com/$GH_REPO/releases/download/$NEW_TAG/pw-arm64.exe"
            echo "    InstallerSha256: $SHA_ARM64"
            echo "ManifestType: installer"
            echo "ManifestVersion: 1.6.0"
          } > KaranBanwasi.Patchwork.installer.yaml
          
          # Create a GitHub Release with the compiled Windows binaries and Winget manifests attached
          gh release create "$NEW_TAG" pw.exe pw-arm64.exe \
            KaranBanwasi.Patchwork.yaml \
            KaranBanwasi.Patchwork.locale.en-US.yaml \
            KaranBanwasi.Patchwork.installer.yaml \
            --title "Release $NEW_TAG" --generate-notes

      - name: Publish to winget-pkgs
        if: env.WINGET_TOKEN != ''
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          NEW_VERSION=${LATEST_TAG#v}
          PKG_ID="KaranBanwasi.Patchwork"
          
          GH_USER=$(gh api user --jq .login)
          git config --global user.name "$GH_USER"
          git config --global user.email "$GH_USER@users.noreply.github.com"
          
          # Ensure fork exists
          gh repo fork microsoft/winget-pkgs --clone=false || true
          
          mkdir -p /tmp/winget-pkgs
          cd /tmp/winget-pkgs
          
          git clone --filter=blob:none --no-checkout --depth 1 "https://x-access-token:${WINGET_TOKEN}@github.com/${GH_USER}/winget-pkgs.git" .
          git remote add upstream "https://github.com/microsoft/winget-pkgs.git"
          git fetch upstream master --depth 1
          
          git sparse-checkout init --cone
          git sparse-checkout set "manifests/k/KaranBanwasi/Patchwork"
          git checkout -B "patchwork-${NEW_VERSION}" FETCH_HEAD
          
          if [ ! -d "manifests/k/KaranBanwasi/Patchwork" ]; then
            echo "Initial package PR has not been merged into microsoft/winget-pkgs yet. Skipping automated version bump PR."
            exit 0
          fi
          
          DEST_DIR="manifests/k/KaranBanwasi/Patchwork/${NEW_VERSION}"
          mkdir -p "$DEST_DIR"
          cp "$GITHUB_WORKSPACE/KaranBanwasi.Patchwork.yaml" "$DEST_DIR/"
          cp "$GITHUB_WORKSPACE/KaranBanwasi.Patchwork.locale.en-US.yaml" "$DEST_DIR/"
          cp "$GITHUB_WORKSPACE/KaranBanwasi.Patchwork.installer.yaml" "$DEST_DIR/"
          
          git add "$DEST_DIR"
          git commit -m "New version: ${PKG_ID} version ${NEW_VERSION}"
          git push -u origin "patchwork-${NEW_VERSION}" --force
          
          gh pr create \
            --repo microsoft/winget-pkgs \
            --head "${GH_USER}:patchwork-${NEW_VERSION}" \
            --base master \
            --title "New version: ${PKG_ID} version ${NEW_VERSION}" \
            --body "Automated release PR for ${PKG_ID} version ${NEW_VERSION}."
