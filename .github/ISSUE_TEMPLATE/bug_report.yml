name: Bug Report
description: File a bug report to help us improve Patchwork
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below to help us reproduce and resolve the issue quickly.
        
        *Note: If you are reporting a security vulnerability, please do NOT use this form. Refer to [SECURITY.md](https://github.com/karan-banwasi/Patchwork/blob/main/SECURITY.md) or submit a [Private Security Advisory](https://github.com/karan-banwasi/Patchwork/security/advisories/new).*

  - type: input
    id: version
    attributes:
      label: Patchwork Version
      description: What version of Patchwork are you running? (Run `pw --version` or `pw version`)
      placeholder: "e.g., v0.0.23 or commit hash"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System & Architecture
      description: Which operating system and CPU architecture are you running on?
      options:
        - Windows 11 / 10 (x64)
        - Windows 11 / 10 (ARM64)
        - macOS (Apple Silicon arm64)
        - macOS (Intel x86_64)
        - Linux (x86_64)
        - Linux (ARM64)
        - Other (specify in description)
    validations:
      required: true

  - type: checkboxes
    id: package_managers
    attributes:
      label: Affected Package Managers
      description: Select all package managers involved in this issue (if applicable)
      options:
        - label: Winget (`winget`)
        - label: Scoop (`scoop`)
        - label: Chocolatey (`choco`)
        - label: Homebrew (`brew`)
        - label: npm Global (`npm`)
        - label: Python uv (`uv`)
        - label: Rust Cargo (`cargo`)
        - label: .NET Global Tools (`dotnet`)
        - label: PowerShell PSResource (`psresource`)
        - label: None / General CLI Core

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened unexpectedly...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue.
      placeholder: |
        1. Run command 'pw upgrade --dry-run'
        2. Select package '...'
        3. See error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: What should have happened...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Logs
      description: Paste any command output, terminal logs, or error stack traces (run with `--verbose` if applicable).
      render: shell

  - type: textarea
    id: config
    attributes:
      label: Configuration (optional)
      description: Paste relevant portions of your configuration file (`config.json`), redacting any private information.
      render: json

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or environment details here.

  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I have confirmed that this bug exists on the latest release of Patchwork.
          required: true
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have not included any sensitive personal information, credentials, or private keys.
          required: true
